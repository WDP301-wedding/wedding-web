<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
  <div aria-busy="true" aria-label="Đang tải" style="position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px">
    <div style="height:28px;width:38%;border-radius:8px;background:#F1E5DB"></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
      <div style="height:148px;border:1px solid #EADFD6;border-radius:16px;background:#FFFFFF;padding:20px;display:flex;flex-direction:column;gap:12px"><span style="height:12px;width:45%;border-radius:6px;background:#F1E5DB"></span><span style="height:28px;width:70%;border-radius:8px;background:#F1E5DB"></span><span style="height:10px;width:55%;border-radius:5px;background:#F1E5DB"></span></div>
      <div style="height:148px;border:1px solid #EADFD6;border-radius:16px;background:#FFFFFF;padding:20px;display:flex;flex-direction:column;gap:12px"><span style="height:12px;width:40%;border-radius:6px;background:#F1E5DB"></span><span style="height:28px;width:60%;border-radius:8px;background:#F1E5DB"></span><span style="height:10px;width:50%;border-radius:5px;background:#F1E5DB"></span></div>
    </div>
    <div style="border:1px solid #EADFD6;border-radius:16px;background:#FFFFFF;padding:8px 0">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5"><div style="height:64px;display:flex;align-items:center;gap:12px;padding:0 20px"><span style="width:40px;height:40px;border-radius:50%;background:#F1E5DB;flex:none"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span style="height:12px;border-radius:6px;background:#F1E5DB;width:{{ r.a }}"></span><span style="height:10px;border-radius:5px;background:#F1E5DB;width:{{ r.b }}"></span></span><span style="width:88px;height:28px;border-radius:12px;background:#F1E5DB"></span></div></sc-for>
    </div>
    <div style="position:absolute;inset:0;pointer-events:none"><div style="width:40%;height:100%;background:linear-gradient(90deg,rgba(255,248,241,0),rgba(255,248,241,0.8),rgba(255,248,241,0));animation:{{ shimmer }}"></div></div>
  </div>
</sc-if>
<sc-if value="{{ isBox }}" hint-placeholder-val="{{ false }}">
  <div role="{{ role }}" style="border:1px solid #EADFD6;border-radius:16px;background:#FFFFFF;padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;max-width:640px;margin:0 auto">
    <span style="width:64px;height:64px;border-radius:50%;background:{{ ic.bg }};color:{{ ic.fg }};display:flex;align-items:center;justify-content:center"><i style="font-size:30px">{{ ic.icon }}</i></span>
    <sc-if value="{{ isLocked }}" hint-placeholder-val="{{ false }}"><span style="height:28px;padding:0 10px 0 6px;border-radius:12px;background:#F7EDE4;color:#6E5D63;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600"><i style="font-size:16px">lock</i>Mở sau khi đặt cọc</span></sc-if>
    <strong style="font-size:20px;line-height:28px;text-wrap:pretty">{{ info.title }}</strong>
    <p style="margin:0;font-size:15px;line-height:24px;color:#6E5D63;max-width:440px;text-wrap:pretty">{{ info.body }}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px">
      <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onRetry }}" style="height:48px;padding:0 20px;border:none;border-radius:12px;background:#7A1F3D;color:#FFFFFF;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px" style-hover="background:#87334F" style-focus="outline:none;box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #7A1F3D"><i>refresh</i>Thử lại</button></sc-if>
      <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onCta }}" style="height:48px;padding:0 20px;border:{{ ctaBorder }};border-radius:12px;background:{{ ctaBg }};color:{{ ctaFg }};font-size:15px;font-weight:600" style-hover="opacity:0.92" style-focus="outline:none;box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #7A1F3D">{{ info.cta }}</button></sc-if>
    </div>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#6E5D63">Mã tham chiếu: <code style="font-family:'JetBrains Mono',monospace;color:#2B1D22">{{ info.refCode }}</code><button aria-label="Sao chép mã tham chiếu" onClick="{{ copyRef }}" style="width:40px;height:40px;border:none;border-radius:50%;background:transparent;color:#6E5D63;display:flex;align-items:center;justify-content:center" style-hover="background:#F4E7E3"><i style="font-size:18px">content_copy</i></button></span></sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const p = this.props, k = p.kind || 'loading', info = p.info || {};
    const ic = { error: { bg: '#FDECEA', fg: '#C62828', icon: 'error' }, empty: { bg: '#FBE9E3', fg: '#7A1F3D', icon: info.icon || 'inbox' }, locked: { bg: '#F7EDE4', fg: '#6E5D63', icon: 'lock' } }[k] || {};
    const isError = k === 'error';
    return {
      isLoading: k === 'loading', isBox: k !== 'loading', isError, isLocked: k === 'locked', ic, info,
      role: isError ? 'alert' : 'status', hasCta: !!info.cta,
      ctaBg: isError ? 'transparent' : '#7A1F3D', ctaFg: isError ? '#7A1F3D' : '#FFFFFF', ctaBorder: isError ? '1px solid #7A1F3D' : 'none',
      shimmer: p.reduce ? 'none' : 'hy-shimmer 1200ms linear infinite',
      rows: [['58%', '32%'], ['44%', '28%'], ['62%', '36%'], ['50%', '30%'], ['56%', '26%']].map(([a, b]) => ({ a, b })),
      onCta: () => p.onCta && p.onCta(), onRetry: () => p.onRetry && p.onRetry(),
      copyRef: () => { try { navigator.clipboard.writeText(info.refCode); } catch (e) {} p.onCopy && p.onCopy(); },
    };
  }
}
</script>
</body>
</html>
