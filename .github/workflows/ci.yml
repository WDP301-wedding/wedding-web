name: Public Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, contract, test, build, and audit gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify locked API contract
        env:
          BACKEND_CONTRACT_READ_TOKEN: ${{ secrets.BACKEND_CONTRACT_READ_TOKEN }}
          OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const lock = JSON.parse(await readFile('api-contract.lock.json', 'utf8'));
          const source = lock?.source;
          const repository = new URL(source?.repository);
          const repositoryParts = repository.pathname.split('/').filter(Boolean);
          const contractParts = source?.path?.split('/');

          if (
            lock?.version !== 1 ||
            repository.protocol !== 'https:' ||
            repository.hostname !== 'github.com' ||
            repository.username ||
            repository.password ||
            repository.search ||
            repository.hash ||
            repositoryParts.length !== 2 ||
            !/^[a-f0-9]{40}$/.test(source?.commit ?? '') ||
            !Array.isArray(contractParts) ||
            contractParts.length === 0 ||
            contractParts.some((part) => !part || part === '.' || part === '..' || part.includes('\\'))
          ) {
            throw new Error('api-contract.lock.json does not identify an immutable GitHub artifact.');
          }

          const artifactUrl = new URL(
            [
              ...repositoryParts,
              source.commit,
              ...contractParts,
            ].map(encodeURIComponent).join('/'),
            'https://raw.githubusercontent.com/',
          );
          const response = await fetch(artifactUrl, {
            headers: {
              Accept: 'application/json',
              ...(process.env.BACKEND_CONTRACT_READ_TOKEN
                ? { Authorization: `Bearer ${process.env.BACKEND_CONTRACT_READ_TOKEN}` }
                : {}),
            },
            redirect: 'error',
          });

          if (!response.ok) {
            throw new Error(
              `Unable to download locked OpenAPI artifact (HTTP ${response.status}). ` +
                'Private repositories require the BACKEND_CONTRACT_READ_TOKEN secret.',
            );
          }

          await writeFile(process.env.OPENAPI_SOURCE, Buffer.from(await response.arrayBuffer()), {
            flag: 'wx',
          });
          NODE
          npm run api:check

      - name: Enforce coverage thresholds
        run: npm run test:coverage -- --maxWorkers=2

      - name: Build production output
        run: npm run build

      - name: Audit locked dependencies
        run: npm run audit:ci
