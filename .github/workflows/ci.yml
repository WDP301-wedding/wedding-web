name: Public Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-web-ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede PR checks, but let an active production deployment finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Static, contract, test, and build gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-web-node-modules-${{ hashFiles('package-lock.json', '.node-version') }}
          restore-keys: |
            ${{ runner.os }}-web-node-modules-

      - name: Install locked dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify locked API contract
        env:
          BACKEND_CONTRACT_READ_TOKEN: ${{ secrets.BACKEND_CONTRACT_READ_TOKEN }}
          OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const lock = JSON.parse(await readFile('api-contract.lock.json', 'utf8'));
          const source = lock?.source;
          const repository = new URL(source?.repository);
          const repositoryParts = repository.pathname.split('/').filter(Boolean);
          const contractParts = source?.path?.split('/');

          if (
            lock?.version !== 1 ||
            repository.protocol !== 'https:' ||
            repository.hostname !== 'github.com' ||
            repository.username ||
            repository.password ||
            repository.search ||
            repository.hash ||
            repositoryParts.length !== 2 ||
            !/^[a-f0-9]{40}$/.test(source?.commit ?? '') ||
            !Array.isArray(contractParts) ||
            contractParts.length === 0 ||
            contractParts.some((part) => !part || part === '.' || part === '..' || part.includes('\\'))
          ) {
            throw new Error('api-contract.lock.json does not identify an immutable GitHub artifact.');
          }

          const artifactUrl = new URL(
            [
              ...repositoryParts,
              source.commit,
              ...contractParts,
            ].map(encodeURIComponent).join('/'),
            'https://raw.githubusercontent.com/',
          );
          const response = await fetch(artifactUrl, {
            headers: {
              Accept: 'application/json',
              ...(process.env.BACKEND_CONTRACT_READ_TOKEN
                ? { Authorization: `Bearer ${process.env.BACKEND_CONTRACT_READ_TOKEN}` }
                : {}),
            },
            redirect: 'error',
          });

          if (!response.ok) {
            throw new Error(
              `Unable to download locked OpenAPI artifact (HTTP ${response.status}). ` +
                'Private repositories require the BACKEND_CONTRACT_READ_TOKEN secret.',
            );
          }

          await writeFile(process.env.OPENAPI_SOURCE, Buffer.from(await response.arrayBuffer()), {
            flag: 'wx',
          });
          NODE
          npm run api:check

      - name: Run automated tests (optional)
        continue-on-error: true
        run: npm test -- --maxWorkers=2 || true

      # Main is built once, with the real production environment, in deploy.
      - name: Restore PR build cache
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-pr-${{ hashFiles('.node-version', 'package-lock.json', 'next.config.*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-pr-${{ hashFiles('.node-version', 'package-lock.json', 'next.config.*') }}-

      - name: Build PR production output
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        timeout-minutes: 8
        run: npm run build

  deploy:
    name: Deploy production to Vercel
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: team_MM73EDATkR2ak6X6qlv3SSnV
      VERCEL_PROJECT_ID: prj_okKTv8Y2punOljXOZmMS1JjSfty6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Restore production build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-production-vercel63-${{ hashFiles('.node-version', 'package-lock.json', 'next.config.*', 'vercel.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-production-vercel63-${{ hashFiles('.node-version', 'package-lock.json', 'next.config.*', 'vercel.json') }}-
      - name: Install pinned Vercel CLI
        timeout-minutes: 3
        run: npm install --global vercel@63.1.0 --prefer-offline --no-audit --no-fund
      - name: Pull production configuration
        timeout-minutes: 2
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        timeout-minutes: 10
        env:
          # Audit already passed in quality; avoid a second audit during npm ci.
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production artifact and wait for readiness
        timeout-minutes: 10
        run: vercel deploy --prebuilt --prod --yes --logs --token="$VERCEL_TOKEN"
